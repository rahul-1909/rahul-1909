<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 210" width="380" height="210">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    .bolt-fast { animation: flashFast 0.3s infinite alternate; }
    .bolt-mid  { animation: flashMid 0.45s infinite alternate; }
    .bolt-slow { animation: flashSlow 0.6s infinite alternate; }
    .sparkle   { animation: sparkMove 0.8s infinite ease-in-out; transform-origin: center; }
    .aura-ring { animation: pulseRing 1.4s infinite ease-in-out; transform-origin: 190px 105px; }
    .pika-box  { transition: transform 0.25s ease; transform-origin: 190px 105px; }
    .pika-box:hover { transform: scale(1.12); }

    @keyframes flashFast {
      0%   { opacity: 0.15; stroke: #FFE600; }
      40%  { opacity: 1;    stroke: #00E5FF; }
      100% { opacity: 0.9;  stroke: #FFFFFF; }
    }
    @keyframes flashMid {
      0%   { opacity: 0.9;  stroke: #FFFFFF; }
      50%  { opacity: 0.1;  stroke: #FFB300; }
      100% { opacity: 1;    stroke: #FFE600; }
    }
    @keyframes flashSlow {
      0%   { opacity: 0.2;  stroke: #00E5FF; }
      50%  { opacity: 1;    stroke: #FFFFFF; }
      100% { opacity: 0.35; stroke: #FFD600; }
    }
    @keyframes sparkMove {
      0%   { transform: scale(0.6) translate(0, 0); opacity: 0.2; }
      50%  { transform: scale(1.4) translate(3px, -3px); opacity: 1; }
      100% { transform: scale(0.7) translate(-2px, 2px); opacity: 0.2; }
    }
    @keyframes pulseRing {
      0%   { transform: scale(0.88); opacity: 0.2; }
      50%  { transform: scale(1.08); opacity: 0.7; }
      100% { transform: scale(0.88); opacity: 0.2; }
    }
  </style>

  <!-- Pulsing Electric Aura -->
  <circle class="aura-ring" cx="190" cy="105" r="58" fill="none" stroke="#FFE600" stroke-width="2.5" stroke-dasharray="8 6" filter="url(#superGlow)" />
  <circle class="aura-ring" cx="190" cy="105" r="72" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="12 10" filter="url(#glow)" />

  <!-- Left Lightning Bolts -->
  <path class="bolt-fast" d="M 135 100 L 148 84 L 141 81 L 160 58 L 152 61 L 166 40" fill="none" stroke="#FFE600" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path class="bolt-mid"  d="M 125 125 L 138 114 L 132 111 L 148 95" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path class="bolt-slow" d="M 148 140 L 158 128 L 152 125 L 168 112" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Lightning Bolts -->
  <path class="bolt-mid"  d="M 245 100 L 232 84 L 239 81 L 220 58 L 228 61 L 214 40" fill="none" stroke="#FFE600" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path class="bolt-fast" d="M 255 125 L 242 114 L 248 111 L 232 95" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path class="bolt-slow" d="M 232 140 L 222 128 L 228 125 L 212 112" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Floating Spark Particles -->
  <polygon class="sparkle" points="118,65 124,68 118,71 114,68" fill="#FFFFFF" filter="url(#glow)" />
  <polygon class="sparkle" points="262,65 268,68 262,71 258,68" fill="#FFE600" filter="url(#glow)" />
  <polygon class="sparkle" points="186,30 192,33 186,36 182,33" fill="#00E5FF" filter="url(#glow)" />
  <polygon class="sparkle" points="194,168 200,171 194,174 190,171" fill="#FFE600" filter="url(#glow)" />
  <polygon class="sparkle" points="105,115 109,117 105,119 102,117" fill="#FFE600" filter="url(#glow)" />
  <polygon class="sparkle" points="275,115 279,117 275,119 272,117" fill="#00E5FF" filter="url(#glow)" />

  <!-- Center Pikachu Sprite -->
  <g class="pika-box">
    <image href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/25.gif" x="145" y="55" width="90" height="95" />
  </g>

  <!-- Voltage Caption -->
  <text x="190" y="192" text-anchor="middle" fill="#FFE600" font-family="'Courier New', monospace" font-size="11.5" font-weight="bold" letter-spacing="2">⚡ 100,000 VOLTS THUNDERBOLT ⚡</text>
</svg>