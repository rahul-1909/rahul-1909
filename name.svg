<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 85" width="100%" height="85">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="35%" stop-color="#FF5E62" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#FF5E62" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 46px;
      letter-spacing: 2px;
      fill: url(#textGrad);
    }
    .spark {
      animation: pulseSpark 1.5s infinite alternate;
    }
    @keyframes pulseSpark {
      0% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1.15); }
    }
  </style>

  <!-- Left Lightning Icon -->
  <g transform="translate(80, 20) scale(1.4)">
    <path d="M 10 2 L 3 14 L 9 14 L 6 24 L 17 10 L 11 10 Z" fill="url(#sparkGrad)" filter="url(#neonGlow)" />
  </g>

  <!-- Centered Name with Neon Gradient -->
  <text class="name" x="400" y="58" text-anchor="middle" filter="url(#neonGlow)">RAHUL TEJA NALLA</text>

  <!-- Right Lightning Icon -->
  <g transform="translate(680, 20) scale(1.4)">
    <path d="M 10 2 L 3 14 L 9 14 L 6 24 L 17 10 L 11 10 Z" fill="url(#sparkGrad)" filter="url(#neonGlow)" />
  </g>
</svg>