<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="100%" height="190">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .name-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #f8fafc; letter-spacing: -0.5px; }
    .role-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 16.5px; fill: #94a3b8; letter-spacing: 0.3px; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 11px; font-weight: 700; fill: #38bdf8; letter-spacing: 1.5px; }
  </style>

  <!-- Background Card -->
  <rect width="100%" height="100%" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Top Accent Stripe -->
  <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 886 0 C 893.732 0 900 6.268 900 14 L 900 4 L 0 4 Z" fill="url(#accentGrad)" />

  <!-- Pokéball Watermark in Background -->
  <g opacity="0.04" transform="translate(760, 95)">
    <circle cx="0" cy="0" r="75" fill="none" stroke="#ffffff" stroke-width="10" />
    <line x1="-75" y1="0" x2="75" y2="0" stroke="#ffffff" stroke-width="10" />
    <circle cx="0" cy="0" r="24" fill="none" stroke="#ffffff" stroke-width="10" />
    <circle cx="0" cy="0" r="11" fill="#ffffff" />
  </g>

  <!-- Content -->
  <g transform="translate(50, 58)">
    <!-- Pill Tag -->
    <rect x="0" y="-24" width="165" height="22" rx="11" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
    <text class="badge-txt" x="14" y="-9">ELITE TRAINER</text>
    <circle cx="148" cy="-13" r="3.5" fill="#38bdf8" filter="url(#softGlow)" />

    <!-- Name Heading -->
    <text class="name-title" x="0" y="32">Rahul Teja Nalla</text>

    <!-- Subtitle Line -->
    <text class="role-sub" x="0" y="66">Software Engineer  |  Backend  •  AI/ML  •  Full-Stack  •  Cloud &amp; SRE</text>
  </g>

  <!-- Bottom Accent Divider -->
  <line x1="50" y1="168" x2="850" y2="168" stroke="url(#glowLine)" stroke-width="1.8" />
</svg>