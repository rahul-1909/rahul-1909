<svg xmlns="http://www.w3.org/2000/svg" width="750" height="320" viewBox="0 0 750 320">
  <style>
    .terminal { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #c9d1d9; }
    .ascii { font-family: 'Fira Code', monospace; font-size: 12px; font-weight: bold; fill: #58a6ff; }
    .title { font-size: 14px; font-weight: bold; fill: #58a6ff; }
    .label { font-weight: bold; fill: #7ee787; }
    .accent { fill: #ffa657; }
    .purple { fill: #d2a8ff; }
    .palette { font-size: 14px; }
  </style>
  <rect width="100%" height="100%" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  
  <!-- ASCII Art Section -->
  <text class="ascii" y="55">
    <tspan x="30" dy="18">      ___          ___      </tspan>
<tspan x="30" dy="18">     /\  \        /\  \     </tspan>
<tspan x="30" dy="18">    /::\  \      /::\  \    </tspan>
<tspan x="30" dy="18">   /:/\:\  \    /:/\:\  \   </tspan>
<tspan x="30" dy="18">  /::\~\:\  \  /::\~\:\  \  </tspan>
<tspan x="30" dy="18"> /:/\:\ \:\__\/:/\:\ \:\__\ </tspan>
<tspan x="30" dy="18"> \/_|::\/:/  /\/_|::\/:/  / </tspan>
<tspan x="30" dy="18">    |:|::/  /    |:|::/  /  </tspan>
<tspan x="30" dy="18">    |:|\/__/     |:|\/__/   </tspan>
<tspan x="30" dy="18">    |:|  |       |:|  |     </tspan>
<tspan x="30" dy="18">     \|__|        \|__|     </tspan>
  </text>
  
